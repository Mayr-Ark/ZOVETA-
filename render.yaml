services:
  - type: web
    name: zeveto-bot
    runtime: node
    plan: free
    region: frankfurt  # closest free region to Lagos; oregon also works
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: AUTH_DIR
        value: /opt/render/project/src/auth
      - key: LOG_LEVEL
        value: info
